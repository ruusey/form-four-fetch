server:
  port: 8085

spring:
  application:
    name: form-four-fetch
  data:
    mongodb:
      uri: mongodb://localhost:27017/sec-collector

formfour:
  # SEC fair-access policy requires a descriptive UA identifying the requester.
  # https://www.sec.gov/os/accessing-edgar-data
  user-agent: "OpenRealmAdmin ruuseywayne@gmail.com"
  # How often (ms) to poll the EDGAR atom feed for new Form 4 filings.
  poll-interval-ms: 30000
  # Number of recent entries to request per poll (max 100 per SEC). EDGAR's
  # getcurrent treats type=4 as a PREFIX match, so the feed is heavily diluted
  # with 424B2/40-F/etc.; request the max so real Form 4s aren't missed.
  poll-count: 100
  # Throttle between sequential EDGAR fetches (ms). SEC limits 10 req/sec.
  request-delay-ms: 150
  # EDGAR returns transient 503/429 under load; retry with exponential backoff.
  max-retries: 4
  retry-backoff-ms: 500

  # --- Anomaly detection (Tier-1 per-ticker robust-Z baseline) ---
  anomaly:
    # |modified Z-score| at/above this is "outside the normal range" for a ticker.
    z-threshold: 3.5
    # Observations required before a ticker+direction baseline is trusted.
    min-samples: 8
    # Recent observations retained per baseline for median/MAD.
    reservoir-size: 200

  # --- Historical backfill (seeds baselines; stays well under SEC 10 req/s) ---
  backfill:
    # Extra pause between filings, on top of request-delay-ms above.
    delay-ms: 400
    # Filings pulled per run when the caller doesn't specify a max.
    default-max: 100
    # Absolute ceiling per run regardless of requested amount.
    hard-cap: 500

  # --- Discord webhook (posts every new Form 4; abnormal ones flagged red) ---
  discord:
    enabled: true
    # Secret: set the DISCORD_WEBHOOK_URL env var. Left blank here so no webhook
    # token is committed; posting is skipped until the env var is provided.
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    # Spacing between webhook messages (ms); Discord allows ~30 msg/min per hook.
    min-interval-ms: 1200

logging:
  level:
    com.formfour: INFO
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: WARN
